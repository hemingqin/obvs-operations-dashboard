services:
  frontend:
    build:
      context: ./frontend
      target: static
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-}
    image: ${FRONTEND_IMAGE:-obvs-frontend:prod}
    volumes:
      - frontend_dist:/usr/share/nginx/html
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/share/nginx/html/index.html"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_internal

  backend:
    build: ./backend
    image: ${BACKEND_IMAGE:-obvs-backend:prod}
    environment:
      APP_ENV: ${APP_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TOKEN_EXPIRE_MINUTES: ${TOKEN_EXPIRE_MINUTES:-60}
      # Must stay in sync with postgres's POSTGRES_USER/POSTGRES_PASSWORD/
      # POSTGRES_DB below -- see the note above the postgres service for why
      # changing this alone does not change what PostgreSQL will accept.
      # scripts/deploy.sh runs backend/db_preflight.py to verify this before
      # the backend container is recreated on every deploy.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DONATIONS_CACHE_TTL_SECONDS: ${DONATIONS_CACHE_TTL_SECONDS:-30}
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app_internal

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - app_internal

  postgres:
    image: postgres:16-alpine
    # IMPORTANT -- read before changing POSTGRES_PASSWORD:
    # The official postgres image only applies POSTGRES_USER/POSTGRES_PASSWORD/
    # POSTGRES_DB the FIRST time it initializes an empty postgres_data volume
    # (initdb). On every later container start/recreate against an EXISTING
    # volume, these variables are ignored -- Postgres logs "database directory
    # appears to contain a database; skipping initialization" and keeps
    # whatever role password was set the day the volume was first created.
    # Editing POSTGRES_PASSWORD here (or in .env.production) after that point
    # does NOT change the real, stored password. If you need to rotate it,
    # you must also run, inside the running postgres container:
    #   ALTER ROLE postgres WITH PASSWORD '<new value>';
    # (or the equivalent \password in psql) -- see
    # docs/deployment-database-credentials.md and the README troubleshooting
    # section for the full, safe procedure. Never delete this volume to
    # "reset" the password -- that destroys production data.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-donations}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-donations}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_internal

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_internal

volumes:
  frontend_dist:
  postgres_data:
  redis_data:
  certbot_www:
  certbot_certs:

networks:
  app_internal:
    driver: bridge
