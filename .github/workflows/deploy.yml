name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_APP_DIR: ${{ vars.EC2_APP_DIR || '~/obvs' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker compose -f docker-compose.prod.yml --env-file .env.production.example build backend

      - name: Build frontend image
        run: docker compose -f docker-compose.prod.yml --env-file .env.production.example build frontend

      - name: Validate default Compose file
        run: docker compose -f docker-compose.yml --env-file .env.development.example config

      - name: Validate production Compose file
        run: docker compose -f docker-compose.prod.yml --env-file .env.production.example config

      - name: Deploy on EC2 over SSH
        if: ${{ env.EC2_HOST != '' && env.EC2_USER != '' && env.EC2_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ env.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            cd "${{ env.EC2_APP_DIR }}"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            chmod +x scripts/deploy.sh
            COMPOSE_FILE=docker-compose.prod.yml ENV_FILE=.env.production DEPLOY_BRANCH=main scripts/deploy.sh

      - name: Skip EC2 deployment until secrets are configured
        if: ${{ env.EC2_HOST == '' || env.EC2_USER == '' || env.EC2_SSH_KEY == '' }}
        run: echo "EC2 deployment skipped. Configure EC2_HOST, EC2_USER, and EC2_SSH_KEY to enable SSH deployment."
