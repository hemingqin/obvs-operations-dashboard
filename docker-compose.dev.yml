services:
  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost/api}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  frontend_node_modules:
